<!DOCTYPE html>
<html  lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>入金完了</title>
</head>
<body>
	<h1>入金完了</h1>
    <p>
	    <span th:text="${username}">ユーザー名</span> さん
	</p>
    <p>入金処理が完了しました。</p>
	<h2>現在の口座残高</h2>
    <p>
	    ¥<span th:text="${#numbers.formatDecimal(balance, 1, 'COMMA', 2, 'POINT')}">0.00</span>
	</p>
    <p><a th:href="@{/account}">マイ口座を確認する</a></p>
	<p><a th:href="@{/home}">ホームへ戻る</a></p>
</body>
</html>
