
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>メール認証</title>
</head>
<body>
    <h1>メール認証</h1>

    <p>登録したメールアドレスに送信された6桁の認証番号を入力してください。</p>
    <p>認証番号の有効期限は5分です。</p>

    <p th:if="${message != null}"
       th:text="${message}"
       style="color: red;"></p>

    <form th:action="@{/verify-code}" method="post">
        <label for="code">認証番号：</label>
        <input type="text"
               id="code"
               name="code"
               inputmode="numeric"
               pattern="[0-9]{6}"
               maxlength="6"
               autocomplete="one-time-code"
               required>

        <button type="submit">認証してログイン</button>
    </form>
</body>
</html>
