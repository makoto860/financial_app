<!DOCTYPE html>
<html  lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>出金の画面</title>
</head>
<body>
	<h1>出金</h1>
	    <p>出金する金額を入力してください。</p>
	    <form th:action="@{/withdrawal}" method="post">
	        <label for="amount">出金額（円）</label>
	        <input type="number" id="amount" name="amount" min="1" step="1" required>
	        <button type="submit">出金する</button>
	    </form>
	    <p><a th:href="@{/home}">ホームへ戻る</a></p>
</body>
</html>
